name: Test Runner

on:
  workflow_call:

jobs:
  test:
    runs-on: macos-latest
    env:
      ITO_ENV: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned to the version the app is developed and tested with. The
      # latest Bun (1.4.2, 2026-09-06) crashes on macOS at process exit after
      # a test that opened the native sqlite3 module (NAPI fatal error), with
      # every test green — a Bun bug, not ours.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set ITO_ENV based on branch
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_BASE_REF}" == "main" ]]; then
            echo "ITO_ENV=prod" >> "$GITHUB_ENV"
          else
            echo "ITO_ENV=dev" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: bun install && cd server && bun install && cd ..

      - name: Run tests
        run: bun runAllTests

      - name: Check code formatting
        run: bun format:app

      - name: Check code linting
        run: bun lint:app

      - name: Check Rust formatting
        run: bun format:native

      - name: Check Rust linting
        run: bun lint:native
